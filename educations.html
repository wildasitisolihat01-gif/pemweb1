            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #b7d4ec;
            padding: 9px;
            text-align: left;
        }

        th {
            background-color: #c9e6fa;
            color: #24496b;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f1f8ff;
        }

        tr:hover {
            background-color: #e2f0fc;
        }
    </style>
